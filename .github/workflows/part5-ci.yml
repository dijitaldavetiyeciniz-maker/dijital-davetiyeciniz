name: Part 5A Final CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Database Migration, RLS & Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: supabase_local_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        
      - name: Run Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Migrations to Test DB
        env:
          DB_URL: "postgresql://postgres:postgrespassword@localhost:5432/supabase_local_db"
        run: |
          supabase db push --db-url "$DB_URL"

      - name: Test Rollback Script
        env:
          DB_URL: "postgresql://postgres:postgrespassword@localhost:5432/supabase_local_db"
        run: |
          psql "$DB_URL" -f supabase/migrations/004_part5a_guest_security_rollback.sql

      - name: Re-Apply Migrations
        env:
          DB_URL: "postgresql://postgres:postgrespassword@localhost:5432/supabase_local_db"
        run: |
          supabase db push --db-url "$DB_URL"

      - name: Run Unit Tests
        run: npx playwright test tests/token.spec.ts tests/import-export.spec.ts --workers=1
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"
          
      - name: Run ESLint
        run: npm run lint
