name: Part 5A Final CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Database Migration, RLS & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        
      - name: Run Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Stack
        run: supabase start

      - name: Test SQL RLS Policies
        run: |
          supabase db query -f supabase/tests/part5a_rls.sql

      - name: Test Rollback Script
        run: |
          supabase db query -f supabase/migrations/004_part5a_guest_security_rollback.sql

      - name: Re-Apply Migrations
        run: |
          supabase db reset

      - name: Run Unit & DB Integration Tests
        run: npx playwright test tests/token.spec.ts tests/import-export.spec.ts tests/server-integration.spec.ts --workers=1
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-key"
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"
          
      - name: Run E2E Tests
        run: npx playwright test tests/part5a-e2e-combined.spec.ts --workers=1
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-key"
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"

      - name: Run ESLint
        run: npm run lint
