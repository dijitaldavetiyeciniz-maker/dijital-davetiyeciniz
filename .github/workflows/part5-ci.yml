name: Part 5A Final CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Database Migration, RLS & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci
        
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase test stack
        run: supabase start

      - name: Verify Supabase health
        run: supabase status

      - name: Export Supabase Secrets
        shell: bash
        run: |
          set -euo pipefail
          set +x

          eval "$(supabase status -o env)"

          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

          test "$(awk -F. '{print NF}' <<< "$SERVICE_ROLE_KEY")" -eq 3

          echo "Supabase URL: SET"
          echo "Anon key: SET"
          echo "Service role key: SET"
          echo "Service role JWT parts: 3"

      - name: Apply migration
        run: supabase db reset --local

      - name: Assert schema
        run: |
          # A simple query to assert 'guests' table exists and has expected columns
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "SELECT column_name FROM information_schema.columns WHERE table_name = 'guests' AND column_name = 'public_id';" | grep "public_id"

      - name: Run RLS SQL tests
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/part5a_rls.sql

      - name: Build application for Playwright
        env:
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"
          GUEST_TOKEN_ACTIVE_KEY_VERSION: "1"
        run: |
          echo $NEXT_PUBLIC_SUPABASE_URL
          echo ${NEXT_PUBLIC_SUPABASE_URL:+SET}
          echo ${NEXT_PUBLIC_SUPABASE_ANON_KEY:+SET}
          echo ${SUPABASE_SERVICE_ROLE_KEY:+SET}
          npm run build

      - name: Run token unit tests
        run: npx playwright test tests/token.spec.ts --workers=1

      - name: Run server repository integration tests
        run: npx playwright test tests/server-integration.spec.ts --workers=1
        env:
          PART5_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          GUEST_TOKEN_SECRET_V1: "ci_dummy_secret_key_at_least_32_chars_long"

      - name: Run Guest Management Playwright
        run: npx playwright test tests/part5-guest-management.spec.ts --workers=1
        env:
          PART5_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Run Token Security Playwright
        run: npx playwright test tests/part5-guest-token-security.spec.ts --workers=1
        env:
          PART5_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Run Access-Control Playwright
        run: npx playwright test tests/part5-access-control.spec.ts --workers=1
        env:
          PART5_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Apply rollback
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/rollback/005_part5a_guest_security_rollback.sql

      - name: Assert rollback
        run: |
          ! psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "SELECT * FROM information_schema.tables WHERE table_name = 'guests';" | grep "guests"

      - name: Reapply migration
        run: supabase db reset --local

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint


      - name: Run critical regression tests
        run: |
          npx playwright test tests/opening-animations.spec.ts tests/modern-event-layout.spec.ts tests/flagship-visual-audit-generator.spec.ts tests/visual-regression.spec.ts --workers=1
